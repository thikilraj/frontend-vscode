<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroHub - E-Commerce Store</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      :root {
        --primary-color: #0f172a;
        --accent-color: #2563eb;
      }

      body {
        background-color: #f8fafc;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Navbar */
      .navbar {
        background-color: var(--primary-color) !important;
      }

      /* Product Cards */
      .product-card {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        border: 1px solid #e2e8f0;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }

      .product-icon {
        font-size: 4rem;
        background-color: #f1f5f9;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Offcanvas Cart */
      .cart-item-img {
        font-size: 2rem;
        width: 50px;
        height: 50px;
        background-color: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
      }

      /* Footer stick to bottom */
      footer {
        margin-top: auto;
        background-color: var(--primary-color);
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-info fs-3" href="#">
          <i class="bi bi-lightning-charge-fill me-1"></i>ElectroHub
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <!-- Search Bar -->
          <div class="d-flex mx-auto my-2 my-lg-0 w-50">
            <div class="input-group">
              <input
                type="text"
                id="search-input"
                class="form-control"
                placeholder="Search gadgets, accessories..."
                onkeyup="filterProducts()"
              />
              <span class="input-group-text bg-primary text-white">
                <i class="bi bi-search"></i>
              </span>
            </div>
          </div>

          <!-- Cart Trigger Button -->
          <button
            class="btn btn-primary position-relative ms-lg-3"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#cartOffcanvas"
          >
            <i class="bi bi-cart3 me-1"></i> Cart
            <span
              id="cart-badge"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              0
            </span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-4">
      <!-- Category Filter Buttons -->
      <div class="row mb-4">
        <div class="col-12 d-flex flex-wrap gap-2 justify-content-center">
          <button
            class="btn btn-outline-dark active filter-btn"
            onclick="filterCategory('All', this)"
          >
            All Products
          </button>
          <button
            class="btn btn-outline-dark filter-btn"
            onclick="filterCategory('Audio', this)"
          >
            Audio
          </button>
          <button
            class="btn btn-outline-dark filter-btn"
            onclick="filterCategory('Wearables', this)"
          >
            Wearables
          </button>
          <button
            class="btn btn-outline-dark filter-btn"
            onclick="filterCategory('Peripherals', this)"
          >
            Peripherals
          </button>
        </div>
      </div>

      <!-- Product Grid -->
      <div class="row g-4" id="product-grid">
        <!-- Products dynamically injected via JavaScript -->
      </div>
    </main>

    <!-- Shopping Cart Offcanvas Sidebar -->
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="cartOffcanvas"
      aria-labelledby="cartOffcanvasLabel"
    >
      <div class="offcanvas-header bg-dark text-white">
        <h5 class="offcanvas-title" id="cartOffcanvasLabel">
          <i class="bi bi-bag-check me-2"></i>Shopping Cart
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>

      <div class="offcanvas-body d-flex flex-column">
        <!-- Cart Items List -->
        <div id="cart-items" class="flex-grow-1 overflow-auto pe-1">
          <!-- Rendered via JS -->
        </div>

        <!-- Cart Summary Footer -->
        <div class="border-top pt-3 mt-3">
          <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
            <span>Total:</span>
            <span id="cart-total" class="text-success">$0.00</span>
          </div>
          <button
            class="btn btn-success w-100 py-2 fw-semibold"
            onclick="checkout()"
          >
            Proceed to Checkout
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        id="actionToast"
        class="toast align-items-center text-bg-dark border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="toast-message">Item added to cart!</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-white text-center py-3">
      <div class="container">
        <p class="mb-0 text-secondary">
          &copy; 2026 ElectroHub Store. Built with Bootstrap 5.
        </p>
      </div>
    </footer>

    <!-- Bootstrap 5 Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application Logic -->
    <script>
      // Product Catalog Data
      const products = [
        {
          id: 1,
          name: "Wireless Headphones",
          category: "Audio",
          price: 99.99,
          icon: "bi-headphones",
        },
        {
          id: 2,
          name: "Smartwatch Ultra",
          category: "Wearables",
          price: 199.99,
          icon: "bi-smartwatch",
        },
        {
          id: 3,
          name: "Bluetooth Speaker",
          category: "Audio",
          price: 49.99,
          icon: "bi-speaker",
        },
        {
          id: 4,
          name: "Gaming Keyboard",
          category: "Peripherals",
          price: 89.99,
          icon: "bi-keyboard",
        },
        {
          id: 5,
          name: "Ergonomic Mouse",
          category: "Peripherals",
          price: 39.99,
          icon: "bi-mouse0",
        },
        {
          id: 6,
          name: "Noise-Cancelling Earbuds",
          category: "Audio",
          price: 129.99,
          icon: "bi-earbuds",
        },
        {
          id: 7,
          name: "Fitness Band",
          category: "Wearables",
          price: 59.99,
          icon: "bi-activity",
        },
        {
          id: 8,
          name: "HD Webcam",
          category: "Peripherals",
          price: 69.99,
          icon: "bi-webcam",
        },
      ];

      let cart = [];
      let activeCategory = "All";

      // Toast instance
      let toastElement = document.getElementById("actionToast");
      let toast = new bootstrap.Toast(toastElement);

      function showToast(message) {
        document.getElementById("toast-message").innerText = message;
        toast.show();
      }

      // Render Product Cards to DOM
      function renderProducts(productList) {
        const grid = document.getElementById("product-grid");
        grid.innerHTML = "";

        if (productList.length === 0) {
          grid.innerHTML = `
          <div class="col-12 text-center text-muted py-5">
            <i class="bi bi-search fs-1"></i>
            <p class="mt-2">No products match your search/filter criteria.</p>
          </div>`;
          return;
        }

        productList.forEach((product) => {
          const col = document.createElement("div");
          col.className = "col-12 col-sm-6 col-md-4 col-lg-3";
          col.innerHTML = `
          <div class="card h-100 product-card shadow-sm">
            <div class="product-icon text-primary">
              <i class="bi ${product.icon}"></i>
            </div>
            <div class="card-body d-flex flex-column">
              <span class="badge bg-secondary mb-2 align-self-start">${product.category}</span>
              <h5 class="card-title text-dark fs-6 font-weight-bold">${product.name}</h5>
              <div class="mt-auto d-flex align-items-center justify-content-between pt-2">
                <span class="fs-5 fw-bold text-success">$${product.price.toFixed(2)}</span>
                <button class="btn btn-outline-primary btn-sm" onclick="addToCart(${product.id})">
                  <i class="bi bi-cart-plus me-1"></i>Add
                </button>
              </div>
            </div>
          </div>
        `;
          grid.appendChild(col);
        });
      }

      // Add Product to Cart
      function addToCart(productId) {
        const existing = cart.find((item) => item.id === productId);
        const product = products.find((p) => p.id === productId);

        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({ ...product, quantity: 1 });
        }

        showToast(`Added "${product.name}" to cart!`);
        updateCartUI();
      }

      // Change Item Quantity
      function changeQuantity(productId, delta) {
        const item = cart.find((i) => i.id === productId);
        if (item) {
          item.quantity += delta;
          if (item.quantity <= 0) {
            cart = cart.filter((i) => i.id !== productId);
          }
        }
        updateCartUI();
      }

      // Update Cart UI Drawer
      function updateCartUI() {
        const cartContainer = document.getElementById("cart-items");
        const cartBadge = document.getElementById("cart-badge");
        const cartTotal = document.getElementById("cart-total");

        cartContainer.innerHTML = "";
        let total = 0;
        let count = 0;

        if (cart.length === 0) {
          cartContainer.innerHTML = `
          <div class="text-center text-muted my-5">
            <i class="bi bi-cart-x fs-1"></i>
            <p class="mt-2">Your cart is currently empty.</p>
          </div>`;
        } else {
          cart.forEach((item) => {
            total += item.price * item.quantity;
            count += item.quantity;

            const itemEl = document.createElement("div");
            itemEl.className =
              "d-flex align-items-center justify-content-between mb-3 border-bottom pb-2";
            itemEl.innerHTML = `
            <div class="d-flex align-items-center">
              <div class="cart-item-img text-primary me-2">
                <i class="bi ${item.icon}"></i>
              </div>
              <div>
                <h6 class="mb-0 text-truncate" style="max-width: 120px;">${item.name}</h6>
                <small class="text-muted">$${item.price.toFixed(2)}</small>
              </div>
            </div>
            <div class="d-flex align-items-center gap-1">
              <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${item.id}, -1)">-</button>
              <span class="fw-bold px-1">${item.quantity}</span>
              <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${item.id}, 1)">+</button>
            </div>
          `;
            cartContainer.appendChild(itemEl);
          });
        }

        cartBadge.innerText = count;
        cartTotal.innerText = `$${total.toFixed(2)}`;
      }

      // Category Filter Handler
      function filterCategory(category, buttonElement) {
        activeCategory = category;

        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        buttonElement.classList.add("active");

        filterProducts();
      }

      // Multi-criteria Search and Category Filter
      function filterProducts() {
        const query = document
          .getElementById("search-input")
          .value.toLowerCase();

        const filtered = products.filter((p) => {
          const matchesCat =
            activeCategory === "All" || p.category === activeCategory;
          const matchesSearch = p.name.toLowerCase().includes(query);
          return matchesCat && matchesSearch;
        });

        renderProducts(filtered);
      }

      // Checkout Action
      function checkout() {
        if (cart.length === 0) {
          alert("Your cart is empty!");
          return;
        }
        alert(
          "Order placed successfully! Thank you for shopping with ElectroHub.",
        );
        cart = [];
        updateCartUI();

        // Close Offcanvas
        const offcanvasEl = document.getElementById("cartOffcanvas");
        const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
        if (offcanvas) offcanvas.hide();
      }

      // Initialize Page
      renderProducts(products);
    </script>
  </body>
</html>
