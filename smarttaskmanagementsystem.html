<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskPulse - Smart Task Management System</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        --card-bg: rgba(30, 41, 59, 0.75);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      body {
        background: var(--bg-gradient);
        color: #f8fafc;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Glassmorphism Styling */
      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      .stat-number {
        font-size: 2.2rem;
        font-weight: 700;
        line-height: 1.1;
      }

      .task-card {
        transition:
          transform 0.2s ease,
          border-color 0.2s ease;
      }

      .task-card:hover {
        transform: translateY(-2px);
        border-color: rgba(59, 130, 246, 0.4) !important;
      }

      .task-completed {
        text-decoration: line-through;
        opacity: 0.6;
      }

      .filter-btn.active {
        background-color: #3b82f6 !important;
        color: #ffffff !important;
        border-color: #3b82f6 !important;
      }

      footer {
        margin-top: auto;
        border-top: 1px solid var(--glass-border);
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary border-opacity-25 py-3"
    >
      <div class="container">
        <a
          class="navbar-brand fw-bold text-info fs-3 d-flex align-items-center gap-2"
          href="#"
        >
          <i class="bi bi-check2-square text-primary"></i> TaskPulse
        </a>

        <!-- Quick Action Trigger Modal -->
        <button
          class="btn btn-primary fw-semibold"
          data-bs-toggle="modal"
          data-bs-target="#taskModal"
          onclick="prepareCreateModal()"
        >
          <i class="bi bi-plus-lg me-1"></i> New Task
        </button>
      </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-4">
      <!-- Top Stat Widgets -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="glass-card p-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-secondary small fw-semibold">TOTAL TASKS</span>
              <i class="bi bi-list-task text-primary fs-4"></i>
            </div>
            <div id="stat-total" class="stat-number text-white mt-2">0</div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="glass-card p-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-secondary small fw-semibold">PENDING</span>
              <i class="bi bi-clock-history text-warning fs-4"></i>
            </div>
            <div id="stat-pending" class="stat-number text-warning mt-2">0</div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="glass-card p-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-secondary small fw-semibold">COMPLETED</span>
              <i class="bi bi-check-circle-fill text-success fs-4"></i>
            </div>
            <div id="stat-completed" class="stat-number text-success mt-2">
              0
            </div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="glass-card p-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-secondary small fw-semibold">PROGRESS</span>
              <i class="bi bi-pie-chart text-info fs-4"></i>
            </div>
            <div id="stat-progress-text" class="stat-number text-info mt-2">
              0%
            </div>
            <div class="progress mt-2" style="height: 6px">
              <div
                id="stat-progress-bar"
                class="progress-bar bg-info"
                role="progressbar"
                style="width: 0%"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls Row: Search & Filters -->
      <div class="row g-3 mb-4 align-items-center">
        <div class="col-12 col-md-5">
          <div class="input-group">
            <span
              class="input-group-text bg-dark border-secondary text-secondary"
            >
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              id="search-input"
              class="form-control bg-dark text-white border-secondary"
              placeholder="Search tasks by title..."
              oninput="renderTasks()"
            />
          </div>
        </div>

        <!-- Filters -->
        <div
          class="col-12 col-md-7 d-flex justify-content-md-end flex-wrap gap-2"
        >
          <!-- Status Filter Buttons -->
          <div class="btn-group" role="group">
            <button
              class="btn btn-sm btn-outline-secondary text-white filter-btn active"
              onclick="setStatusFilter('All', this)"
            >
              All
            </button>
            <button
              class="btn btn-sm btn-outline-secondary text-white filter-btn"
              onclick="setStatusFilter('Pending', this)"
            >
              Pending
            </button>
            <button
              class="btn btn-sm btn-outline-secondary text-white filter-btn"
              onclick="setStatusFilter('Completed', this)"
            >
              Completed
            </button>
          </div>

          <!-- Priority Selector -->
          <select
            id="priority-filter"
            class="form-select form-select-sm bg-dark text-white border-secondary w-auto"
            onchange="renderTasks()"
          >
            <option value="All">All Priorities</option>
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
        </div>
      </div>

      <!-- Task List Container -->
      <div class="row g-3" id="task-list-container">
        <!-- Dynamic Tasks Rendered Here -->
      </div>
    </main>

    <!-- Create/Edit Task Modal -->
    <div
      class="modal fade"
      id="taskModal"
      tabindex="-1"
      aria-labelledby="taskModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content glass-card text-white border border-secondary"
        >
          <div
            class="modal-header border-bottom border-secondary border-opacity-25"
          >
            <h5 class="modal-title fw-bold" id="taskModalLabel">
              Create New Task
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="task-form" onsubmit="handleFormSubmit(event)">
            <div class="modal-body">
              <input type="hidden" id="task-id" />

              <div class="mb-3">
                <label class="form-label small text-secondary"
                  >Task Title</label
                >
                <input
                  type="text"
                  id="task-title"
                  class="form-control bg-dark text-white border-secondary"
                  placeholder="e.g., Complete Python/Django Module"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label small text-secondary"
                  >Description</label
                >
                <textarea
                  id="task-desc"
                  class="form-control bg-dark text-white border-secondary"
                  rows="3"
                  placeholder="Add additional task details..."
                ></textarea>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label small text-secondary"
                    >Priority</label
                  >
                  <select
                    id="task-priority"
                    class="form-select bg-dark text-white border-secondary"
                    required
                  >
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                  </select>
                </div>

                <div class="col-6">
                  <label class="form-label small text-secondary"
                    >Category</label
                  >
                  <select
                    id="task-category"
                    class="form-select bg-dark text-white border-secondary"
                    required
                  >
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Study">Study</option>
                    <option value="Projects">Projects</option>
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small text-secondary">Due Date</label>
                <input
                  type="date"
                  id="task-duedate"
                  class="form-control bg-dark text-white border-secondary"
                  required
                />
              </div>
            </div>

            <div
              class="modal-footer border-top border-secondary border-opacity-25"
            >
              <button
                type="button"
                class="btn btn-outline-secondary text-white"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary fw-semibold">
                Save Task
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="py-3 text-center text-secondary small">
      <div class="container">
        <p class="mb-0">
          &copy; 2026 TaskPulse Management System. Built with Bootstrap 5 &
          JavaScript.
        </p>
      </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application Logic -->
    <script>
      // Task Dataset State
      let tasks = JSON.parse(localStorage.getItem("taskpulse_tasks")) || [
        {
          id: 1,
          title: "Review System Architecture Design",
          desc: "Examine modular layout for backend API integrations and database scaling.",
          priority: "High",
          category: "Projects",
          dueDate: "2026-09-20",
          completed: false,
        },
        {
          id: 2,
          title: "Prepare Weekly Progress Presentation",
          desc: "Draft dynamic slide deck detailing recent features and sprint backlog items.",
          priority: "Medium",
          category: "Work",
          dueDate: "2026-09-18",
          completed: true,
        },
        {
          id: 3,
          title: "Complete Python Full-Stack Exercise",
          desc: "Solve database query exercises and configure CRUD routes.",
          priority: "Low",
          category: "Study",
          dueDate: "2026-09-22",
          completed: false,
        },
      ];

      let currentStatusFilter = "All";

      // Local Storage Helper
      function saveTasks() {
        localStorage.setItem("taskpulse_tasks", JSON.stringify(tasks));
        updateStats();
      }

      // Modal Operations
      function prepareCreateModal() {
        document.getElementById("taskModalLabel").innerText = "Create New Task";
        document.getElementById("task-form").reset();
        document.getElementById("task-id").value = "";

        // Default to today's date
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("task-duedate").value = today;
      }

      function editTask(id) {
        const task = tasks.find((t) => t.id === id);
        if (!task) return;

        document.getElementById("taskModalLabel").innerText = "Edit Task";
        document.getElementById("task-id").value = task.id;
        document.getElementById("task-title").value = task.title;
        document.getElementById("task-desc").value = task.desc;
        document.getElementById("task-priority").value = task.priority;
        document.getElementById("task-category").value = task.category;
        document.getElementById("task-duedate").value = task.dueDate;

        const modal = new bootstrap.Modal(document.getElementById("taskModal"));
        modal.show();
      }

      // Submit Form (Create / Update)
      function handleFormSubmit(e) {
        e.preventDefault();

        const id = document.getElementById("task-id").value;
        const title = document.getElementById("task-title").value.trim();
        const desc = document.getElementById("task-desc").value.trim();
        const priority = document.getElementById("task-priority").value;
        const category = document.getElementById("task-category").value;
        const dueDate = document.getElementById("task-duedate").value;

        if (id) {
          // Edit Mode
          const task = tasks.find((t) => t.id == id);
          if (task) {
            task.title = title;
            task.desc = desc;
            task.priority = priority;
            task.category = category;
            task.dueDate = dueDate;
          }
        } else {
          // Create Mode
          const newTask = {
            id: Date.now(),
            title,
            desc,
            priority,
            category,
            dueDate,
            completed: false,
          };
          tasks.unshift(newTask);
        }

        saveTasks();
        renderTasks();

        const modalElement = document.getElementById("taskModal");
        const modal = bootstrap.Modal.getInstance(modalElement);
        modal.hide();
      }

      // Toggle Task Completion State
      function toggleComplete(id) {
        const task = tasks.find((t) => t.id === id);
        if (task) {
          task.completed = !task.completed;
          saveTasks();
          renderTasks();
        }
      }

      // Delete Task
      function deleteTask(id) {
        tasks = tasks.filter((t) => t.id !== id);
        saveTasks();
        renderTasks();
      }

      // Set Status Filter State
      function setStatusFilter(status, btnElement) {
        currentStatusFilter = status;
        document
          .querySelectorAll(".filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        btnElement.classList.add("active");
        renderTasks();
      }

      // Helper: Priority Badge Styling
      function getPriorityBadgeClass(priority) {
        switch (priority) {
          case "High":
            return "bg-danger text-white";
          case "Medium":
            return "bg-warning text-dark";
          case "Low":
            return "bg-info text-dark";
          default:
            return "bg-secondary text-white";
        }
      }

      // Helper: Category Badge Styling
      function getCategoryBadgeClass(category) {
        switch (category) {
          case "Work":
            return "bg-primary bg-opacity-25 text-primary border border-primary";
          case "Projects":
            return "bg-success bg-opacity-25 text-success border border-success";
          case "Study":
            return "bg-purple bg-opacity-25 text-info border border-info";
          default:
            return "bg-secondary bg-opacity-25 text-light border border-secondary";
        }
      }

      // Render Dynamic Task List
      function renderTasks() {
        const container = document.getElementById("task-list-container");
        const searchQuery = document
          .getElementById("search-input")
          .value.toLowerCase();
        const priorityQuery = document.getElementById("priority-filter").value;

        container.innerHTML = "";

        // Filter Tasks
        const filtered = tasks.filter((task) => {
          const matchesSearch =
            task.title.toLowerCase().includes(searchQuery) ||
            task.desc.toLowerCase().includes(searchQuery);
          const matchesStatus =
            currentStatusFilter === "All" ||
            (currentStatusFilter === "Pending" && !task.completed) ||
            (currentStatusFilter === "Completed" && task.completed);
          const matchesPriority =
            priorityQuery === "All" || task.priority === priorityQuery;

          return matchesSearch && matchesStatus && matchesPriority;
        });

        if (filtered.length === 0) {
          container.innerHTML = `
          <div class="col-12 text-center text-secondary py-5">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
            <p class="mb-0">No tasks found matching your selected criteria.</p>
          </div>
        `;
          return;
        }

        // Populate Cards
        filtered.forEach((task) => {
          const col = document.createElement("div");
          col.className = "col-12 col-md-6 col-lg-4";
          col.innerHTML = `
          <div class="glass-card p-3 h-100 d-flex flex-column justify-content-between task-card">
            <div>
              <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="badge ${getCategoryBadgeClass(task.category)} px-2 py-1">${task.category}</span>
                <span class="badge ${getPriorityBadgeClass(task.priority)} px-2 py-1">${task.priority}</span>
              </div>

              <div class="d-flex align-items-start gap-2">
                <input 
                  type="checkbox" 
                  class="form-check-input mt-1" 
                  ${task.completed ? "checked" : ""} 
                  onclick="toggleComplete(${task.id})" 
                />
                <h6 class="fw-bold mb-1 ${task.completed ? "task-completed text-secondary" : "text-white"}">
                  ${task.title}
                </h6>
              </div>

              <p class="small text-secondary mt-2 mb-3 ${task.completed ? "task-completed" : ""}">
                ${task.desc || "No description provided."}
              </p>
            </div>

            <div class="pt-2 border-top border-secondary border-opacity-25 d-flex align-items-center justify-content-between">
              <small class="text-secondary">
                <i class="bi bi-calendar-event me-1"></i>${task.dueDate}
              </small>

              <div class="d-flex gap-1">
                <button class="btn btn-sm btn-outline-info border-0" onclick="editTask(${task.id})">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteTask(${task.id})">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
          container.appendChild(col);
        });
      }

      // Update Analytics Stats
      function updateStats() {
        const total = tasks.length;
        const completed = tasks.filter((t) => t.completed).length;
        const pending = total - completed;
        const percentage =
          total > 0 ? Math.round((completed / total) * 100) : 0;

        document.getElementById("stat-total").innerText = total;
        document.getElementById("stat-pending").innerText = pending;
        document.getElementById("stat-completed").innerText = completed;
        document.getElementById("stat-progress-text").innerText =
          `${percentage}%`;
        document.getElementById("stat-progress-bar").style.width =
          `${percentage}%`;
      }

      // Initialize App UI
      updateStats();
      renderTasks();
    </script>
  </body>
</html>
