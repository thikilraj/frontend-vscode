<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      }

      .calculator {
        width: 320px;
        background-color: #1e293b;
        border-radius: 20px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        padding: 20px;
      }

      /* Screen Display */
      .display {
        background-color: #0f172a;
        border-radius: 12px;
        padding: 15px;
        text-align: right;
        margin-bottom: 20px;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        word-wrap: break-word;
        word-break: break-all;
      }

      .previous-op {
        color: #94a3b8;
        font-size: 0.9rem;
        min-height: 1.2rem;
      }

      .current-op {
        color: #ffffff;
        font-size: 2rem;
        font-weight: 600;
      }

      /* Buttons Layout */
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      .btn {
        border: none;
        outline: none;
        background-color: #334155;
        color: #f8fafc;
        font-size: 1.25rem;
        font-weight: 500;
        padding: 16px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
      }

      .btn:hover {
        background-color: #475569;
      }

      .btn:active {
        transform: scale(0.95);
      }

      /* Button Variants */
      .btn.action {
        background-color: #ef4444;
        color: #ffffff;
      }

      .btn.action:hover {
        background-color: #dc2626;
      }

      .btn.operator {
        background-color: #3b82f6;
        color: #ffffff;
      }

      .btn.operator:hover {
        background-color: #2563eb;
      }

      .btn.equals {
        grid-column: span 2;
        background-color: #10b981;
        color: #ffffff;
      }

      .btn.equals:hover {
        background-color: #059669;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <!-- Display Screen -->
      <div class="display">
        <div id="previous-op" class="previous-op"></div>
        <div id="current-op" class="current-op">0</div>
      </div>

      <!-- Buttons Grid -->
      <div class="buttons">
        <button class="btn action" onclick="clearDisplay()">AC</button>
        <button class="btn action" onclick="deleteLast()">DEL</button>
        <button class="btn operator" onclick="appendOperator('%')">%</button>
        <button class="btn operator" onclick="appendOperator('/')">÷</button>

        <button class="btn" onclick="appendNumber('7')">7</button>
        <button class="btn" onclick="appendNumber('8')">8</button>
        <button class="btn" onclick="appendNumber('9')">9</button>
        <button class="btn operator" onclick="appendOperator('*')">×</button>

        <button class="btn" onclick="appendNumber('4')">4</button>
        <button class="btn" onclick="appendNumber('5')">5</button>
        <button class="btn" onclick="appendNumber('6')">6</button>
        <button class="btn operator" onclick="appendOperator('-')">−</button>

        <button class="btn" onclick="appendNumber('1')">1</button>
        <button class="btn" onclick="appendNumber('2')">2</button>
        <button class="btn" onclick="appendNumber('3')">3</button>
        <button class="btn operator" onclick="appendOperator('+')">+</button>

        <button class="btn" onclick="appendNumber('0')">0</button>
        <button class="btn" onclick="appendNumber('.')">.</button>
        <button class="btn equals" onclick="calculate()">=</button>
      </div>
    </div>

    <script>
      let currentInput = "";
      let previousInput = "";
      let operator = null;

      const currentDisplay = document.getElementById("current-op");
      const previousDisplay = document.getElementById("previous-op");

      function updateDisplay() {
        currentDisplay.innerText = currentInput || "0";
        if (operator !== null) {
          previousDisplay.innerText = `${previousInput} ${getOperatorSymbol(operator)}`;
        } else {
          previousDisplay.innerText = "";
        }
      }

      function getOperatorSymbol(op) {
        switch (op) {
          case "*":
            return "×";
          case "/":
            return "÷";
          case "-":
            return "−";
          default:
            return op;
        }
      }

      function appendNumber(number) {
        if (number === "." && currentInput.includes(".")) return;
        currentInput += number;
        updateDisplay();
      }

      function appendOperator(op) {
        if (currentInput === "" && previousInput === "") return;

        if (currentInput === "" && previousInput !== "") {
          operator = op;
          updateDisplay();
          return;
        }

        if (previousInput !== "") {
          calculate();
        }

        operator = op;
        previousInput = currentInput;
        currentInput = "";
        updateDisplay();
      }

      function calculate() {
        let result;
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);

        if (isNaN(prev) || isNaN(current)) return;

        switch (operator) {
          case "+":
            result = prev + current;
            break;
          case "-":
            result = prev - current;
            break;
          case "*":
            result = prev * current;
            break;
          case "/":
            if (current === 0) {
              alert("Cannot divide by zero!");
              clearDisplay();
              return;
            }
            result = prev / current;
            break;
          case "%":
            result = prev % current;
            break;
          default:
            return;
        }

        currentInput = result.toString();
        operator = null;
        previousInput = "";
        updateDisplay();
      }

      function clearDisplay() {
        currentInput = "";
        previousInput = "";
        operator = null;
        updateDisplay();
      }

      function deleteLast() {
        currentInput = currentInput.slice(0, -1);
        updateDisplay();
      }

      // Keyboard support
      document.addEventListener("keydown", (event) => {
        const key = event.key;

        if (!isNaN(key) || key === ".") {
          appendNumber(key);
        } else if (["+", "-", "*", "/", "%"].includes(key)) {
          appendOperator(key);
        } else if (key === "Enter" || key === "=") {
          event.preventDefault();
          calculate();
        } else if (key === "Backspace") {
          deleteLast();
        } else if (key === "Escape") {
          clearDisplay();
        }
      });
    </script>
  </body>
</html>
